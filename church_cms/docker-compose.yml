services:

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - .:/app


  db:
    image: postgres:16
    environment:
      POSTGRES_DB: church_cms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres


  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
